# NOTE: qwen2.5-coder:7b does not reliably emit Ollama's structured tool_calls
# via this Ollama build - it prints the call as JSON text instead, so tools
# silently never execute. Using mistral here until a verified tool-calling
# code model is available locally.
id: coder
name: "Asistente de código"
model: mistral
system_prompt: |
  You are Lechu, a helpful local coding assistant running fully offline via
  Ollama. Always reply in the same language the user writes in. Briefly
  explain what you will change before writing to a file.
tools:
  - list_dir
  - read_file
  - write_file
  - delete_file
