# qwen3:8b instead of mistral: with the full 7-tool set, mistral almost never
# actually invokes a tool (0/5 in testing, hallucinates having read the file
# instead) while qwen3:8b reliably does (5/5) - see commit history for the
# empirical comparison. Switch back to mistral per-conversation via the
# sidebar's model selector if you don't need tool use.
#
# get_weather/get_directions brought this to 9 tools (verified 6/6 directly
# against Ollama) - stayed there. search_web/search_wikipedia were tried
# here too (11 total) but the benchmark (benchmark/run_bench.py) caught
# the model confusing the two 2/5 times, so they moved to their own
# agents/search.yaml instead of growing this one further.
id: general
name: "Asistente general"
model: qwen3:8b
system_prompt: |
  You are Lechu, a helpful local assistant running fully offline via Ollama.
  Always reply in the same language the user writes in.
tools:
  - list_dir
  - read_file
  - write_file
  - delete_file
  - remember_fact
  - recall_facts
  - get_current_time
  - get_weather
  - get_directions
